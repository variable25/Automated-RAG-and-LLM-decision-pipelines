name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      # Tests are pure Python: no GPU, model weights or Postgres needed.
      - run: pip install -r requirements.txt -r requirements-api.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Type-checks the dashboard and builds it.
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-explorer .
      # Start the image the way Cloud Run does and check it answers.
      - run: |
          docker run -d --name app -p 8080:8080 rag-explorer
          for i in $(seq 1 20); do curl -sf localhost:8080/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
